<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in | Analab admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="auth">

  <section class="auth-art" aria-hidden="false">
    <div class="auth-copy">
      <h1>Publish a new version in under a minute.</h1>
      <p>Set the version number, upload the installer, and the download page on your website updates itself.</p>
    </div>

    <figure class="decay" id="decay" style="margin:0" aria-label="Pressure decay curve settling above the reject limit, result: pass">
      <svg viewBox="0 0 640 340" role="img" aria-hidden="true">
        <line class="axis" x1="48" y1="20" x2="48" y2="300"/>
        <line class="axis" x1="48" y1="300" x2="620" y2="300"/>
        <text x="56" y="30">kPa</text>
        <text x="620" y="322" text-anchor="end">seconds</text>
        <line class="limit" id="limit" x1="48" x2="620"/>
        <text class="limit-label" id="limit-label" x="56">Reject limit 48.0 kPa</text>
        <path class="curve" id="curve" d=""/>
        <g id="endmark">
          <circle class="ring" r="5"/>
          <circle class="end" r="5"/>
        </g>
        <g class="passchip" id="chip">
          <rect width="176" height="30" rx="15"/>
          <circle class="passchip-dot" cx="17" cy="15" r="4"/>
          <text x="30" y="19.5">Pass   0.012 kPa/s</text>
        </g>
      </svg>
    </figure>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <img class="auth-logo" src="/assets/logo.png" alt="Analab" width="284" height="66">
      <h2>Sign in</h2>
      <p class="sub">Manage Analab versions and installers.</p>

      <div class="alert alert-error" id="error" role="alert" aria-live="assertive" hidden></div>

      <form id="login" method="post" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="input-eye" type="button" id="eye" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="remember"> Keep me signed in for 30 days</label>
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit" style="height:50px;font-size:15px">Sign in</button>
      </form>

      <a class="auth-back" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        Back to website
      </a>
    </div>
  </section>

</main>
<script src="/admin/login.js"></script>
</body>
</html>
